<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 - 熊猫问卷</title>
  <link rel="stylesheet" href="/css/base.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="logo-line">
        <svg width="56" height="56" viewBox="0 0 32 32">
          <circle cx="16" cy="16" r="15" fill="#1f2329"/>
          <circle cx="11" cy="13" r="4" fill="#fff"/>
          <circle cx="21" cy="13" r="4" fill="#fff"/>
          <circle cx="11.5" cy="13.5" r="1.8" fill="#1f2329"/>
          <circle cx="20.5" cy="13.5" r="1.8" fill="#1f2329"/>
          <ellipse cx="16" cy="21" rx="5" ry="3.4" fill="#fff"/>
        </svg>
        <div>
          <div class="name">熊猫问卷</div>
          <div style="font-size:12px;color:var(--text-3)">注册即可创建你的问卷</div>
        </div>
      </div>
      <div class="card">
        <div class="field">
          <label>用户名</label>
          <input class="input" id="username" placeholder="3 到 24 位字母、数字或下划线" autocomplete="username">
        </div>
        <div class="field">
          <label>密码</label>
          <input class="input" id="password" type="password" placeholder="至少 8 位" autocomplete="new-password">
        </div>
        <div class="field">
          <label>确认密码</label>
          <input class="input" id="password2" type="password" placeholder="再输入一次" autocomplete="new-password">
          <div class="error-text" id="err" style="display:none"></div>
        </div>
        <button class="btn btn-primary btn-block btn-lg" id="submitBtn">注 册</button>
        <p style="margin-top:14px;text-align:center;font-size:13px;color:var(--text-2)">
          已有账号？<a href="/login">直接登录</a>
        </p>
      </div>
    </div>
  </div>
  <script type="module">
    import { api } from '/js/api.js';
    const $ = (id) => document.getElementById(id);
    async function register() {
      const err = $('err');
      err.style.display = 'none';
      if ($('password').value !== $('password2').value) {
        err.textContent = '两次输入的密码不一致';
        err.style.display = '';
        return;
      }
      $('submitBtn').disabled = true;
      try {
        await api('/api/auth/register', {
          method: 'POST',
          body: { username: $('username').value.trim(), password: $('password').value },
        });
        location.href = '/console';
      } catch (e) {
        err.textContent = e.message;
        err.style.display = '';
        $('submitBtn').disabled = false;
      }
    }
    $('submitBtn').addEventListener('click', register);
    $('password2').addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter') {
        register();
      }
    });
  </script>
</body>
</html>
